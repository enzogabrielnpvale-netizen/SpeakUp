type User @table {
  email: String!
  name: String!
  avatarUrl: String
}

type Project @table {
  name: String!
  owner: User!
  description: String
  createdAt: Timestamp
}

type Document @table {
  title: String!
  contentSnippet: String!
  project: Project!
  fileUrl: String
  uploadedAt: Timestamp
}

type Insight @table {
  question: String!
  answer: String!
  project: Project!
  createdBy: User!
  tags: [String]
  createdAt: Timestamp
}

type ProjectMember @table(key: ["project", "user"]) {
  project: Project!
  user: User!
  role: String!
}