mutation CreateUser($name: String!, $email: String!) @auth(level: USER) {
  user_insert(data: {id_expr: "auth.uid", name: $name, email: $email})
}

mutation UpdateUser($name: String) @auth(level: USER) {
  user_update(key: {id_expr: "auth.uid"}, data: {name: $name})
}

mutation DeleteUser @auth(level: USER) {
  user_delete(key: {id_expr: "auth.uid"})
}

query GetCurrentUser @auth(level: USER) {
  user(key: {id_expr: "auth.uid"}) {
    name
    email
  }
}

query ListUsers @auth(level: PUBLIC, insecureReason: "Public directory of users is allowed.") {
  users {
    id
    name
  }
}

mutation CreateProject($name: String!, $description: String) @auth(level: USER) {
  project_insert(data: {name: $name, description: $description, ownerId_expr: "auth.uid"})
}

mutation UpdateProject($id: UUID!, $name: String) @auth(expr: "auth.uid != nil") {
  project_update(id: $id, data: {name: $name})
}

mutation DeleteProject($id: UUID!) @auth(expr: "auth.uid != nil") {
  project_delete(id: $id)
}

query GetProject($id: UUID!) @auth(expr: "auth.uid != nil") {
  project(id: $id) {
    name
    owner { name }
  }
}

query ListProjects @auth(expr: "auth.uid != nil") {
  projects {
    id
    name
  }
}

mutation CreateDocument($title: String!, $contentSnippet: String!, $projectId: UUID!) @auth(expr: "auth.uid != nil") {
  document_insert(data: {title: $title, contentSnippet: $contentSnippet, projectId: $projectId})
}

mutation UpdateDocument($id: UUID!, $title: String) @auth(expr: "auth.uid != nil") {
  document_update(id: $id, data: {title: $title})
}

mutation DeleteDocument($id: UUID!) @auth(expr: "auth.uid != nil") {
  document_delete(id: $id)
}

query GetDocument($id: UUID!) @auth(expr: "auth.uid != nil") {
  document(id: $id) {
    title
    contentSnippet
  }
}

query ListDocuments @auth(expr: "auth.uid != nil") {
  documents {
    title
    fileUrl
  }
}

mutation CreateInsight($question: String!, $answer: String!, $projectId: UUID!) @auth(level: USER) {
  insight_insert(data: {question: $question, answer: $answer, projectId: $projectId, createdById_expr: "auth.uid"})
}

mutation UpdateInsight($id: UUID!, $answer: String) @auth(expr: "auth.uid != nil") {
  insight_update(id: $id, data: {answer: $answer})
}

mutation DeleteInsight($id: UUID!) @auth(expr: "auth.uid != nil") {
  insight_delete(id: $id)
}

query GetInsight($id: UUID!) @auth(expr: "auth.uid != nil") {
  insight(id: $id) {
    question
    answer
  }
}

query ListInsights @auth(expr: "auth.uid != nil") {
  insights {
    question
    tags
  }
}

mutation CreateProjectMember($projectId: UUID!, $userId: UUID!, $role: String!) @auth(expr: "auth.uid != nil") {
  projectMember_insert(data: {projectId: $projectId, userId: $userId, role: $role})
}

mutation UpdateProjectMember($projectId: UUID!, $userId: UUID!, $role: String!) @auth(expr: "auth.uid != nil") {
  projectMember_update(key: {projectId: $projectId, userId: $userId}, data: {role: $role})
}

mutation DeleteProjectMember($projectId: UUID!, $userId: UUID!) @auth(expr: "auth.uid != nil") {
  projectMember_delete(key: {projectId: $projectId, userId: $userId})
}

query GetProjectMember($projectId: UUID!, $userId: UUID!) @auth(expr: "auth.uid != nil") {
  projectMember(key: {projectId: $projectId, userId: $userId}) {
    role
  }
}

query ListProjectMembers($projectId: UUID!) @auth(expr: "auth.uid != nil") {
  projectMembers(where: {projectId: {eq: $projectId}}) {
    user { name }
    role
  }
}